<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tupã EJ</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- cabeçalho com menu-->
    <header class="header">
        <div class="logo">
            <img src="./assets/images/icons/LogoVermelhoTupaHorizontal.png" alt="Logo Tupã">
        </div>
        <!-- o menu vai retornar para a pag principal, execeto o fale conosco-->
        <nav class="header-menu">
            <ul>
                <li><a href="./index.html/#inicio" class="active">Inicio</a></li>
                <li><a href="./index.html/#quem-somos">Quem somos</a></li>
                <li><a href="./index.html/#servicos">Serviços</a></li>
                <li><a href="./index.html/#projetos">Projetos</a></li>
                <li><a href="#contato" class="btn-contato">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    
    <main>

        <!-- SEÇÃO DE CONTATO / FORMULÁRIO -->
        <section id="contato" class="secao-contato">
            <div class="contato-cabecalho">
                <h2>Se interessou em algum dos nossos serviços?</h2>
                <p>Preencha as informações e entre em contato com a nossa equipe</p>
            </div>

            <form action="#" method="POST" class="form-contato">
                <!-- Nome -->
                <div class="form-grupo">
                    <label for="nome">Nome *</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Informe seu nome completo" 
                        required 
                    >
                </div>

                <!-- Telefone -->
                <div class="form-grupo">
                    <label for="telefone">Telefone *</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        name="telefone" 
                        placeholder="(99) 99999-9999" 
                        required
                    >
                </div>

                <!-- E-mail -->
                <div class="form-grupo">
                    <label for="email">E-mail *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Seu melhor E-mail" 
                        required
                    >
                </div>

                <!-- Serviço de Interesse -->
                <div class="form-grupo">
                    <label for="servico">Serviço de Interesse *</label>
                        <select id="servico" name="servico" required>
                            <option value="" disabled selected>Selecione um serviço</option>
                            <option value="sites">Sites</option>
                            <option value="sistemas">Sistemas de Gestão Interna</option>
                            <option value="aplicativos">Aplicativos</option>
                            <option value="mentoria">Mentoria</option>
                        </select>
                </div>

                <!-- Como podemos lhe ajudar -->
                <div class="form-grupo">
                    <label for="mensagem">Como Podemos lhe ajudar? *</label>
                    <textarea 
                        id="mensagem" 
                        name="mensagem" 
                        rows="4" 
                        placeholder="Descreva de forma breve o que precisa!" 
                        required
                    ></textarea>
                </div>

                <!-- Botão de Envio -->
                <div class="form-grupo-botao">
                    <button type="submit" class="btn-enviar">Enviar Mensagem</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
